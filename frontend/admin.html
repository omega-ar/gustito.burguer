<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - El Gustito</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="container">
      <div class="logo">
        <img src="img/logo_3.png" alt="El Gustito" class="logo-img">
        <h2>Panel de Administración</h2>
      </div>
      <div class="header-info">
        <span id="userName"></span>
        <button id="btnLogout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</button>
      </div>
    </div>
  </header>

  <div class="dashboard-container">
    <div class="admin-sidebar">
      <button class="sidebar-btn active" data-section="stock">
        <i class="fas fa-boxes"></i> Stock
      </button>
      <button class="sidebar-btn" data-section="alertas">
        <i class="fas fa-bell"></i> Alertas
      </button>
      <button class="sidebar-btn" data-section="reportes">
        <i class="fas fa-chart-line"></i> Reportes
      </button>
      <button class="sidebar-btn" data-section="pedidos">
        <i class="fas fa-shopping-cart"></i> Pedidos
      </button>
    </div>

    <div class="admin-main">
      <div id="sectionStock" class="section-content active">
        <h2><i class="fas fa-boxes"></i> Control de Stock</h2>
        <button id="btnActualizarStock" class="btn-refresh"><i class="fas fa-sync-alt"></i> Actualizar</button>
        <div class="stock-table-container">
          <table class="stock-table">
            <thead>
              <tr>
                <th>Ingrediente</th>
                <th>Stock Actual</th>
                <th>Stock Mínimo</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="stockTableBody">
              <tr><td colspan="5"><div class="loader"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div id="sectionAlertas" class="section-content">
        <h2><i class="fas fa-bell"></i> Alertas de Stock Bajo</h2>
        <div id="alertasContainer"></div>
      </div>

      <div id="sectionReportes" class="section-content">
        <h2><i class="fas fa-chart-line"></i> Reportes</h2>
        <div class="filtros">
          <input type="date" id="reporteFecha">
          <button id="btnGenerarReporte"><i class="fas fa-chart-bar"></i> Generar</button>
        </div>
        <div id="reporteResultado"></div>
      </div>

      <div id="sectionPedidos" class="section-content">
        <h2><i class="fas fa-shopping-cart"></i> Historial de Pedidos</h2>
        <div class="filtros">
          <input type="date" id="pedidosFecha">
          <button id="btnBuscarPedidos"><i class="fas fa-search"></i> Buscar</button>
        </div>
        <div id="pedidosLista"></div>
      </div>
    </div>
  </div>

  <div id="modalActualizarStock" class="modal">
    <div class="modal-content">
      <h3>Actualizar Stock</h3>
      <input type="hidden" id="editIngredienteId">
      <div class="form-group">
        <label>Nuevo stock</label>
        <input type="number" id="editStock" min="0">
      </div>
      <div class="form-group">
        <label>Motivo</label>
        <input type="text" id="editMotivo" placeholder="Ej: Compra a proveedor, Ajuste manual">
      </div>
      <div class="modal-buttons">
        <button id="btnGuardarStock" class="btn-primary">Guardar</button>
        <button class="btn-secondary close-modal">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="javascript/config.js"></script>
  <script src="javascript/admin.js"></script>
</body>
</html>
